<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Jornada</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Control Horario</h1>
    <button id="btn-config">⚙️ Configurar datos</button>
  </header>

  <main>
    <form id="registro-form">
      <label>Fecha: <input type="date" id="fecha" required></label>
      <label>Horario:</label>
      <div class="presets">
        <button type="button" data-m="09:00" data-sm="14:00" data-t="16:00" data-st="18:00">Completa (9-14 / 16-18)</button>
        <button type="button" data-m="08:00" data-sm="15:00" data-t="" data-st="">Mañana 8-15</button>
        <button type="button" data-m="09:00" data-sm="14:00" data-t="" data-st="">Solo Mañana (9-14)</button>
        <button type="button" data-obs="VACACIONES">Vacaciones</button>
        <button type="button" data-obs="FESTIVO">Festivo</button>
        <button type="button" data-clear>Limpiar</button>
      </div>
      <div class="inputs">
        <input type="time" id="em" placeholder="Entrada Mañana">
        <input type="time" id="sm" placeholder="Salida Mañana">
        <input type="time" id="et" placeholder="Entrada Tarde">
        <input type="time" id="st" placeholder="Salida Tarde">
        <input type="text" id="obs" placeholder="Observaciones">
      </div>
      <button type="submit">💾 Guardar registro</button>
    </form>
    <div id="status"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
