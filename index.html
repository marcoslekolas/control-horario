<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Horario Mensual</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
</head>
<body>
  <header>
    <h1>📅 Control Horario</h1>
    <div class="controls">
      <button id="btn-prev">◀</button>
      <span id="mes-actual"></span>
      <button id="btn-next">▶</button>
    </div>
  </header>

  <main>
    <table id="calendario">
      <thead>
        <tr>
          <th>Día</th><th>Tipo</th><th>Entrada M.</th><th>Salida M.</th><th>Entrada T.</th><th>Salida T.</th><th>Horas</th><th>Obs.</th>
        </tr>
      </thead>
      <tbody id="tbody-calendario"></tbody>
    </table>

    <div class="actions">
      <button id="btn-config" class="sec">⚙️ Datos Empresa/Trabajador</button>
      <button id="btn-generar" class="primary">📥 Generar Excel Mensual</button>
    </div>
  </main>

  <!-- Modal de configuración previa al Excel -->
  <dialog id="modal-config">
    <h2>Revisar días antes de generar</h2>
    <p>Marca los días que necesites modificar:</p>
    <div id="lista-revision"></div>
    <div class="modal-actions">
      <button id="btn-cancelar" class="sec">Cancelar</button>
      <button id="btn-confirmar" class="primary">✅ Generar y descargar</button>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
