<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Horario</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
</head>
<body>
  <header>
    <h1>📅 Control Horario</h1>
    <div>
      <button id="btn-prev">◀</button>
      <span id="mes-actual"></span>
      <button id="btn-next">▶</button>
    </div>
  </header>
  <main>
    <table id="calendario">
      <thead>
        <tr><th>Día</th><th>Entrada M.</th><th>Salida M.</th><th>Entrada T.</th><th>Salida T.</th><th>Horas</th><th>Obs.</th></tr>
      </thead>
      <tbody id="tbody-calendario"></tbody>
    </table>
    <div style="margin-top:1rem; display:flex; gap:0.5rem; flex-wrap:wrap;">
      <button id="btn-config">⚙️ Datos</button>
      <button id="btn-export">💾 Backup</button>
      <button id="btn-import">📂 Restaurar</button>
      <input type="file" id="file-import" accept=".json" style="display:none;">
      <button id="btn-generar" style="background:#2563eb; color:#fff; margin-left:auto;">📊 Generar Excel</button>
    </div>
  </main>
  <dialog id="modal-config">
    <h3>Datos</h3>
    <form id="form-config">
      <label>Empresa:<input type="text" id="cfg-empresa" required></label>
      <label>CIF:<input type="text" id="cfg-cif" required></label>
      <label>CCC:<input type="text" id="cfg-ccc"></label>
      <label>Trabajador:<input type="text" id="cfg-trabajador" required></label>
      <label>NIF:<input type="text" id="cfg-nif" required></label>
      <label>NAF:<input type="text" id="cfg-naf"></label>
      <div style="margin-top:1rem; display:flex; justify-content:flex-end; gap:0.5rem;">
        <button type="button" id="btn-cancelar">Cancelar</button>
        <button type="submit">Guardar</button>
      </div>
    </form>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
