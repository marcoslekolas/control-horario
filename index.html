<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Horario</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>
<body>
  <header>
    <div>
      <h1>📅 Control Horario</h1>
      <p id="info-trabajador" style="font-size:0.85rem; color:#64748b; margin-top:0.25rem;"></p>
    </div>
    <div class="controls">
      <button id="btn-prev">◀</button>
      <span id="mes-actual"></span>
      <button id="btn-next">▶</button>
    </div>
  </header>

  <main>
    <table id="calendario">
      <thead>
        <tr>
          <th>Día</th><th>Tipo</th><th>Entrada M.</th><th>Salida M.</th><th>Entrada T.</th><th>Salida T.</th><th>Horas</th><th>Obs.</th>
        </tr>
      </thead>
      <tbody id="tbody-calendario"></tbody>
    </table>

    <div class="actions">
      <div class="actions-left">
        <button id="btn-config" class="sec">⚙️ Datos</button>
        <button id="btn-export" class="sec">💾 Backup</button>
        <button id="btn-import" class="sec">📂 Restaurar</button>
        <input type="file" id="file-import" accept=".json" style="display:none;">
      </div>
      <div class="actions-right">
        <button id="btn-generar-anual" class="primary">📊 Generar Excel Anual</button>
      </div>
    </div>
  </main>

  <dialog id="modal-config">
    <h2>Datos de Empresa y Trabajador</h2>
    <form id="form-config">
      <label>Empresa:<input type="text" id="cfg-empresa" required></label>
      <label>CIF:<input type="text" id="cfg-cif" required></label>
      <label>CCC:<input type="text" id="cfg-ccc" placeholder="Opcional"></label>
      <label>Trabajador:<input type="text" id="cfg-trabajador" required></label>
      <label>NIF:<input type="text" id="cfg-nif" required></label>
      <label>NAF:<input type="text" id="cfg-naf" placeholder="Opcional"></label>
      <div class="modal-actions">
        <button type="button" id="btn-cancelar" class="sec">Cancelar</button>
        <button type="submit" class="primary">Guardar</button>
      </div>
    </form>
  </dialog>

  <dialog id="modal-generar">
    <h2>Generar Excel Anual</h2>
    <p>Se generará un archivo con 12 pestañas (una por mes) para el año:</p>
    <p style="font-size:1.5rem; font-weight:bold; color:var(--primary); text-align:center;" id="anio-generar"></p>
    <div class="modal-actions">
      <button id="btn-cancelar-gen" class="sec">Cancelar</button>
      <button id="btn-confirmar-gen" class="primary">✅ Generar y Descargar</button>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
