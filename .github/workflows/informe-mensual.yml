name: Generar Informe Mensual
on:
  schedule:
    - cron: '0 2 1 * *'  # Día 1 a las 02:00 UTC
  workflow_dispatch:

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: node scripts/generar-informe.js
        env:
          MES_REF: ${{ github.run_id }} # Se calculará en el script
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add informes/
          git commit -m "📊 Informe mensual automático [skip ci]" || echo "Sin cambios"
          git push
