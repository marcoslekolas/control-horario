name: Generar Informe Control Horario
on:
  push:
    paths:
      - 'data/registros.json'  # Se activa al subir el JSON
  schedule:
    - cron: '0 2 1 * *'        # O el día 1 de cada mes a las 02:00 UTC
  workflow_dispatch:           # O manualmente

permissions:
  contents: write              # Necesario para que Actions haga commit del Excel

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
      - run: node scripts/generar-informe.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add informes/
          git commit -m "📊 Informe actualizado automáticamente [skip ci]" || echo "Sin cambios"
          git push
